- type: entity
  parent: BaseSubdermalImplant
  id: NekrometamorphoImplant
  name: nekrometamorpho implant
  description: This implant will inform the Syndicate radio channel should the user fall into critical condition or die.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateNekrometamorphoImplant
    whitelist:
      components:
      - Cuffable # useless if you cant be cuffed
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: TriggerOnActivateImplant
  - type: SpawnOnTrigger
    proto: MobBeeAngrySwarm
  - type: DeleteOnTrigger
  - type: GibOnTrigger
    targetUser: true
